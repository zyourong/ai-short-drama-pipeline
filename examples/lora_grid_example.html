body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
h1 { text-align: center; color: #333; }
.desc { text-align: center; color: #666; margin-bottom: 20px; }
.grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 900px; margin: 0 auto; }
.grid-cell { position: relative; cursor: pointer; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.15); transition: transform 0.2s; }
.grid-cell:hover { transform: scale(1.03); }
.grid-cell img { width: 100%; display: block; }
.grid-cell .label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: white; font-size: 11px; padding: 3px 6px; text-align: center; }
.grid-cell.best .label { background: rgba(220, 53, 69, 0.85); font-weight: bold; }
.lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
.lightbox.active { display: flex; }
.lightbox img { max-width: 80%; max-height: 75%; border-radius: 8px; }
.lightbox .info { color: white; margin-top: 15px; font-size: 16px; text-align: center; }
.lightbox .hint { color: #999; margin-top: 8px; font-size: 13px; }
.nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); color: white; border: none; font-size: 32px; padding: 20px 15px; cursor: pointer; border-radius: 8px; }
.nav-btn:hover { background: rgba(255,255,255,0.35); }
.nav-prev { left: 20px; }
.nav-next { right: 20px; }
.close-btn { position: absolute; top: 20px; right: 30px; color: white; font-size: 36px; cursor: pointer; background: none; border: none; }

var currentIdx = 0;
var grid = document.getElementById('grid');

images.forEach(function(img, idx) {
    var cell = document.createElement('div');
    cell.className = 'grid-cell' + (img.best ? ' best' : '');
    cell.onclick = function() { openLightbox(idx); };
    cell.innerHTML = '<img src="data:image/jpeg;base64,' + img.thumb + '" alt="pw=' + img.pw + ' cg=' + img.cg + '"><div class="label">pw=' + img.pw + ' | cg=' + img.cg + (img.best ? ' ⭐推荐' : '') + '</div>';
    grid.appendChild(cell);
});

document.getElementById('totalCount').textContent = images.length;

function openLightbox(idx) {
    currentIdx = idx;
    updateLightbox();
    document.getElementById('lightbox').classList.add('active');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }
function navigate(dir) {
    currentIdx = (currentIdx + dir + images.length) % images.length;
    updateLightbox();
}
function updateLightbox() {
    var img = images[currentIdx];
    document.getElementById('lightboxImg').src = 'data:image/jpeg;base64,' + img.thumb;
    document.getElementById('lightboxInfo').innerHTML = '<span style="font-size:18px;font-weight:bold;">pw=' + img.pw + ' | cg=' + img.cg + '</span>' + (img.best ? ' <span style="color:#ff6b6b;">⭐ 推荐最佳参数</span>' : '') + '<br><span style="color:#aaa;font-size:13px;">' + (currentIdx+1) + ' / ' + images.length + '</span>';
}

document.addEventListener('keydown', function(e) {
    if (!document.getElementById('lightbox').classList.contains('active')) return;
    if (e.key === 'ArrowLeft') navigate(-1);
    if (e.key === 'ArrowRight') navigate(1);
    if (e.key === 'Escape') closeLightbox();
});
</script>
